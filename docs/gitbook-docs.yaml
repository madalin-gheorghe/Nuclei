$schema: https://api.gitbook.com/gitbook-docs.yaml
version: 1
site:
  title: Nuclei
  structure:
    - type: space
      key: space-documentation
      title: Documentation
      path: documentation
      default: true
      content:
        directory: ./
    - type: space
      key: space-performance
      title: Performance
      path: performance
      content:
        directory: ./performance
    - type: space
      key: space-versioning
      title: Versioning
      path: versioning
      content:
        directory: ./versioning
